name: ci

# Quality gates for the node-kimai SDK, ported from the node-hudu/node-autotask
# line: typecheck, lint, build, offline test suite with coverage thresholds.
# Deliberate omissions (per the line): no secrets, no publish-adjacent steps.
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24] # engines.node: ">=24.0.0"; matches the line's engines
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      # Full offline gate chain: typecheck x3, lint, build, published-surface guard,
      # capability gate + negative-fixture proof, MCP projection check, coverage.
      - name: Verify
        run: npm run verify
      # Ship gate: no capability row may remain planned/implemented.
      - name: Ship gate
        run: npm run capabilities:check:ship
